services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./client:/client
      - ./server:/server
      - /client/node_modules
      - deno_cache:/deno-dir
    environment:
      - DENO_DIR=/deno-dir
      - CHOKIDAR_USEPOLLING=true

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./server:/server
    environment:
      - CHOKIDAR_USEPOLLING=true
      - SERVER_HOST=0.0.0.0

volumes:
  deno_cache:
